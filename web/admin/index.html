<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Wall-HUB · Админка</title>
  <link rel="stylesheet" href="/lib/base.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4M8.5 11l2 2 5-5"/></svg></span><span>Wall-HUB</span></div>
      <p class="muted" id="login-hint"></p>
      <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password" required>
      <input type="password" id="login-repeat" data-i18n-placeholder placeholder="Повторите пароль" autocomplete="new-password" hidden>
      <button class="btn btn-primary" type="submit" id="login-submit">Войти</button>
      <div class="error" id="login-error"></div>
    </form>
  </div>

  <div id="app" class="layout" hidden>
    <nav class="sidebar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4M8.5 11l2 2 5-5"/></svg></span><span class="brand-text">Wall-HUB<small id="brand-version"></small></span></div>
      <div class="tabs" id="tabs"></div>
      <button class="btn logout" id="logout"><span id="logout-icon"></span><span data-i18n>Выйти</span></button>
    </nav>
    <main class="content" id="content"></main>
  </div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
