<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>Wall-HUB</title>
  <link rel="stylesheet" href="/lib/base.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="kiosk">
  <main class="desktops" id="desktops"><div class="desk-track" id="desk-track"></div></main>
  <div class="dots" id="dots" hidden></div>
  <!-- Верхний край: свайп вниз открывает шторку. Точка — есть новая версия. -->
  <div class="edge" id="edge"><span class="edge-dot" id="edge-dot" hidden></span></div>
  <div class="status-offline" id="status-offline" hidden>нет связи с сервисом</div>
  <div class="shade-backdrop" id="shade-backdrop" hidden></div>
  <div class="shade" id="shade"></div>
  <div class="settings" id="settings" hidden></div>
  <div class="night" id="night"></div>
  <div class="dim" id="dim" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
